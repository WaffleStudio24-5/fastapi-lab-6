[project]
name = "fastapi-lab-6"
version = "0.1.0"
description = "Waffle Studio FastAPI 6주차: 전체 엔드포인트 비동기 전환·트랜잭션과 락"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "pymysql[rsa]>=1.1,<2",
    "asyncmy>=0.2,<0.3",
    "cryptography",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = [
    "alembic>=1.13,<2",
    "pytest>=8,<9",
    "aiosqlite>=0.20,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
